# All asset paths are relative to this configuration file.
video: videos/教室前中_左_802监控_20260830130816_20260830133147_1530775.mp4
output_dir: outputs
device: cuda:0
torch_threads: 4
bpjdet:
  repo: BPJDet
  weights: weights/ch_head_s_1536_e150_best_mMR.pt
  image_size: 768
  confidence: 0.35 # 检测置信度阈值，必须为0～1之间的数字
  nms_iou: 0.4
  match_inside_ratio: 0.6
head_pose:
  repo: SemiUHPE
  weights: weights/DAD-WildHead-EffNetV2-S-best.pth
  min_head_pixels: 12
  edges_scale: -0.05
  batch_size: 8
reference:
  axis_degrees: 30.0
direction:
  min_projection_length: 0.08
  max_abs_pitch_deg: 90.0
temporal:
  normal_threshold_deg: 43.0 # 初始用轴差、建立正常朝向后用有方向的偏离角；≤此值为正常范围，单位：度
  turn_threshold_deg: 52.0 # 相对本次锁定正常朝向的偏离角≥此值时累计转头确认时间，单位：度
  min_normal_stable_seconds: 1.6 # 连续处于正常范围的最短时间，用于建立正常起点或确认回正，单位：秒
  min_turned_stable_seconds: 0.1 # 连续达到转头角度阈值的最短时间，满足路径样本要求后确认事件，单位：秒
  max_frame_direction_jump_deg: 150.0 # 原始或平滑方向相对上一有效方向的跳变上限，单位：度；超过此值拒绝，用于过滤头姿反向误判
  smooth_window_frames: 5 # 每人最多使用最近多少个有效方向样本做单位向量平均；不是每隔多少帧检测一次
  min_smooth_resultant: 0.2 # 平均方向向量的最小长度（0～1）；低于此值表示方向互相抵消，平滑结果无效
  max_valid_gap_seconds: 0.3 # 相邻有效方向样本允许的最大时间间隔；超过则重新建立连续路径，单位：秒
  min_transition_samples: 3 # 确认转头所需的最少连续有效路径样本数，包含最后一个正常起点样本
  trend_window_frames: 5 # 最多使用最近多少个有效参考偏离角样本判断增大或减小趋势
  trend_min_change_deg: 2.0 # 趋势窗口末值减首值的最小变化量；正向触发转出、负向触发返回，单位：度
tracking:
  iou_threshold: 0.3
  max_missing_seconds: 0.7
standing_filter:
  enabled: false
  weights: weights/yolo26s-pose.pt
  perspective_calibration: standing_perspective.json
  image_size: 640
  confidence: 0.25
  nms_iou: 0.7
  keypoint_confidence: 0.35
  match_iou: 0.3
  min_coverage: 0.3
  require_leg_evidence: true
  enter_score: 0.60
  release_score: 0.45
  min_standing_score: 0.80
  smooth_window_frames: 15
  ema_alpha: 0.35
  viterbi_window_frames: 38
  viterbi_stay: 0.92
  viterbi_sigma: 0.15
  min_valid_observations: 2
  evidence_grace_seconds: 0.6
  max_sample_gap_seconds: 0.2
display:
  draw_all_non_standing: true
  show_standing_exclusions: true
  output_width: 1920
  font_scale: 0.45
  axis_half_length: 40
  arrow_length: 45
